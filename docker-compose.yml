services:
  backup-ui:
    build: .
    container_name: backup-ui
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - backup-data:/app/data
      # Mount SSH keys for remote access (to non-root user's home)
      - ~/.ssh:/home/backupx/.ssh:ro
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=UTC
      - LISTEN_PORT=9090
      # PostgreSQL configuration
      - DATABASE_TYPE=postgresql
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=backupx
      - DATABASE_USER=backupx
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-backupx-secure-password}
      - DATABASE_POOL_MAX=${DATABASE_POOL_MAX:-20}
      - DATABASE_POOL_TIMEOUT=${DATABASE_POOL_TIMEOUT:-30}
      # Scheduled backups
      - BACKUP_MAX_CONCURRENT=${BACKUP_MAX_CONCURRENT:-4}
      - BACKUP_MISFIRE_GRACE=${BACKUP_MISFIRE_GRACE:-21600}
      - BACKUP_OVERDUE_GRACE=${BACKUP_OVERDUE_GRACE:-21600}
      # Snapshot retention (restic forget/prune); off until turned on, see DEPLOYMENT.md
      - RETENTION_ENABLED=${RETENTION_ENABLED:-false}
      - RETENTION_DRY_RUN=${RETENTION_DRY_RUN:-false}
      - RETENTION_PRUNE_CRON=${RETENTION_PRUNE_CRON:-0 4 * * sun}
      - RETENTION_PRUNE_MAX_UNUSED=${RETENTION_PRUNE_MAX_UNUSED:-10%}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: backup-postgres
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=backupx
      - POSTGRES_USER=backupx
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:-backupx-secure-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backupx -d backupx"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  backup-data:
  postgres-data:

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 10.200.0.0/24
